def remapDataMapReloadFixtureJar = tasks.register('remapDataMapReloadFixtureJar', RemapJarTask) {
    group = 'build'
    description = 'Remaps the isolated data-map reload probe fixture for a packaged server.'
    dependsOn dataMapReloadFixtureJar
    inputFile = dataMapReloadFixtureJar.flatMap { it.archiveFile }
    archiveFileName = "mekanism-datamap-reload-fixture-${resolvedModVersion}.jar"
