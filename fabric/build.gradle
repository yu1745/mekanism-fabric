def releaseJarOutputs = fileTree(layout.buildDirectory.dir('libs')) { include '*.jar' }
def remappedDataMapFixtureOutputs = fileTree(layout.buildDirectory.dir('datamap-reload-fixture/remapped')) { include '*.jar' }
def verifyDataMapReloadFixtureIsolation = tasks.register('verifyDataMapReloadFixtureIsolation') {
    group = 'verification'
    description = 'Checks that the packaged reload fixture remains isolated from the release artifact.'
    dependsOn remapDataMapReloadFixtureJar
    inputs.files(remappedDataMapFixtureOutputs)
    doLast {
        def releaseOutputs = releaseJarOutputs.files
        if (releaseOutputs.any { it.name.contains('datamap-reload-fixture') }) {
            throw new GradleException('Data-map reload fixture entered fabric/build/libs')
        }
        def fixtureOutputs = remappedDataMapFixtureOutputs.files
        if (fixtureOutputs.size() != 1) {
            throw new GradleException("Expected exactly one remapped data-map fixture JAR: ${fixtureOutputs}")
        }
    }
}
tasks.named('check') {
    dependsOn verifyDataMapReloadFixtureIsolation
}

