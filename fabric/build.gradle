import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    handshakeMismatchFixture
    handshakeMissingReceiverFixture
    fabricTransferTest
    fabricRegistryTest
}

loom {
    accessWidenerPath = file('src/main/resources/mekanism.accesswidener')
    createRemapConfigurations(sourceSets.handshakeMismatchFixture)
    createRemapConfigurations(sourceSets.handshakeMissingReceiverFixture)

    mods {
        mekanism {
            sourceSet sourceSets.main
        }
        handshakeMismatchFixture {
            sourceSet sourceSets.handshakeMismatchFixture
        }
        handshakeMissingReceiverFixture {
            sourceSet sourceSets.handshakeMissingReceiverFixture
        }
    }

    runs {
        handshakeServer {
            server()
            name = 'Mekanism handshake server'
            source sourceSets.main
            runDir = System.getProperty('mekanism.handshake.serverDir', 'run/handshake-server')
        }
        handshakeClient {
            client()
            name = 'Mekanism handshake client'
            source sourceSets.main
            runDir = System.getProperty('mekanism.handshake.clientDir', 'run/handshake-client')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismSmoke')
        }
        handshakeMismatchClient {
            client()
            name = 'Mekanism mismatched handshake fixture client'
            source sourceSets.handshakeMismatchFixture
            runDir = System.getProperty('mekanism.handshake.mismatchClientDir', 'run/handshake-mismatch-client')
            property 'mekanism.handshake.fixtureMode', System.getProperty('mekanism.handshake.fixtureMode', 'version_mismatch')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismMismatch')
        }
        handshakeMissingReceiverClient {
            client()
            name = 'Mekanism missing-protocol-receiver handshake fixture client'
            source sourceSets.handshakeMissingReceiverFixture
            runDir = System.getProperty('mekanism.handshake.missingReceiverClientDir', 'run/handshake-missing-receiver-client')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismMissing')
        }
    }
}

repositories {
    // Team Reborn Energy is published on Fabric's Maven. Keep this build isolated
    // from the NeoForge repositories in the root build.
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

def loadSlice = { String listName ->
    def entries = file(listName).readLines()
          .collect { it.trim() }
          .findAll { it && !it.startsWith('#') }
    if (entries.size() != entries.toSet().size()) {
        throw new GradleException("fabric/${listName} contains duplicate source paths")
    }
    entries
}
def apiSlice = loadSlice('api-slice.txt')
def commonSlice = loadSlice('common-slice.txt')
def platformSlice = loadSlice('platform-slice.txt')
def apiSliceFiles = apiSlice.collect { file("../src/api/java/${it}") }
def commonSliceFiles = commonSlice.collect { file("../src/main/java/${it}") }
def platformSliceFiles = platformSlice.collect { file("src/main/java/${it}") }
if (apiSlice.size() != 64 || commonSlice.size() != 122 || platformSlice.size() != 19) {
    throw new GradleException("Unexpected Fabric source slice counts: api=${apiSlice.size()} common=${commonSlice.size()} platform=${platformSlice.size()}")
}

// Compile only the unchanged official root tests that cover admitted common-slice
// behavior, in place, through this exact allowlist. Do not add ../src/test/java as a
// source root: unrelated NeoForge tests must remain outside the Fabric test closure.
def officialRootTestOracle = [
      'mekanism/common/lib/collection/BiLongMultimapTest.java',
      'mekanism/common/lib/collection/IndexedCuboidMapTest.java',
      'mekanism/common/lib/distribution/DistributionTest.java',
      'mekanism/common/lib/distribution/DistributionLongTest.java',
      'mekanism/common/lib/distribution/DistributionPropertyTest.java',
      'mekanism/common/lib/distribution/handler/InfiniteIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/InfiniteLongHandler.java',
      'mekanism/common/lib/distribution/handler/IntegerHandler.java',
      'mekanism/common/lib/distribution/handler/LongHandler.java',
      'mekanism/common/lib/distribution/handler/LyingAmountIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/LyingAmountLongHandler.java',
      'mekanism/common/lib/distribution/handler/PartialIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/PartialLongHandler.java',
      'mekanism/common/lib/distribution/handler/SpecificAmountIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/SpecificAmountLongHandler.java',
      'mekanism/common/lib/distribution/target/IntegerTarget.java',
      'mekanism/common/lib/distribution/target/LongTarget.java',
      'mekanism/common/util/ChunkUtilsTest.java',
]
def officialRootTestOracleFiles = officialRootTestOracle.collect { file("../src/test/java/${it}") }

def registerPortableSliceCheck = { String taskName, String descriptionText, List<File> sources ->
    tasks.register(taskName) {
        group = 'verification'
        description = descriptionText
        inputs.files(sources)
        doLast {
            def missing = sources.findAll { !it.isFile() }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing portable slice sources: ${missing.join(', ')}")
            }
            def violations = sources.findAll { it.text.contains('net.neoforged.') }
            if (!violations.isEmpty()) {
                throw new GradleException("NeoForge references entered a Fabric source slice: ${violations.join(', ')}")
            }
        }
    }
}
registerPortableSliceCheck('verifyApiSliceNoNeoForge',
      'Checks that every allowlisted official API source exists and has no NeoForge reference.', apiSliceFiles)
registerPortableSliceCheck('verifyCommonSliceNoNeoForge',
      'Checks that every allowlisted official common source exists and has no NeoForge reference.', commonSliceFiles)
registerPortableSliceCheck('verifyPlatformSliceNoNeoForge',
      'Checks that every allowlisted Fabric platform source exists and has no NeoForge reference.', platformSliceFiles)

def verifyOfficialRootTestSources = tasks.register('verifyOfficialRootTestSources') {
    group = 'verification'
    description = 'Checks the exact 18-file official root-test oracle allowlist.'
    inputs.files(officialRootTestOracleFiles)
    doLast {
        if (officialRootTestOracle.size() != 18 || officialRootTestOracle.size() != officialRootTestOracle.toSet().size()) {
            throw new GradleException('The official root-test oracle must contain exactly 18 unique paths')
        }
        def missing = officialRootTestOracleFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing official root-test oracle sources: ${missing.join(', ')}")
        }
    }
}

sourceSets {
    handshakeMismatchFixture {
        // Reuse only main's external Minecraft/Fabric compile dependencies; never main output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    handshakeMissingReceiverFixture {
        // Reuse external dependencies but never main or mismatch-fixture output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    fabricTransferTest {
        // Keep Knot and its TCCL out of the ordinary jqwik/Jupiter suite. This source set
        // contains the item transaction and fluid conversion suites, sees production output and
        // its own pinned Jupiter libraries, but never ordinary test output.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    fabricRegistryTest {
        // The sole root-registry integration test gets its own Knot worker and never sees
        // ordinary or transfer-test output.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    main {
        java {
            srcDirs = ['src/main/java', '../src/api/java', '../src/main/java']
            apiSlice.each { include it }
            commonSlice.each { include it }
            platformSlice.each { include it }
        }
    }
}

def mainOutputFiles = files(sourceSets.main.output)
def mismatchOutputFiles = files(sourceSets.handshakeMismatchFixture.output)
def mismatchRuntimeFiles = files(sourceSets.handshakeMismatchFixture.runtimeClasspath)
def missingReceiverRuntimeFiles = files(sourceSets.handshakeMissingReceiverFixture.runtimeClasspath)
def mismatchSourceFiles = files(sourceSets.handshakeMismatchFixture.allJava)
def missingReceiverSourceFiles = files(sourceSets.handshakeMissingReceiverFixture.allJava)
def mismatchMetadataFile = layout.projectDirectory.file('src/handshakeMismatchFixture/resources/fabric.mod.json')
def missingReceiverMetadataFile = layout.projectDirectory.file('src/handshakeMissingReceiverFixture/resources/fabric.mod.json')
def verifyHandshakeFixtureIsolation = tasks.register('verifyHandshakeFixtureIsolation') {
    group = 'verification'
    description = 'Checks that rejection-smoke clients cannot load Mekanism production classes.'
    inputs.files(mismatchSourceFiles, missingReceiverSourceFiles, mismatchMetadataFile, missingReceiverMetadataFile)
    doLast {
        def canonical = { File file -> file.canonicalFile }
        def mainOutput = mainOutputFiles.files.collect(canonical).toSet()
        def mismatchOutput = mismatchOutputFiles.files.collect(canonical).toSet()
        def mismatchClasspath = mismatchRuntimeFiles.files.collect(canonical).toSet()
        def missingClasspath = missingReceiverRuntimeFiles.files.collect(canonical).toSet()
        if (!mainOutput.intersect(mismatchClasspath).isEmpty() || !mainOutput.intersect(missingClasspath).isEmpty()) {
            throw new GradleException('Handshake fixture runtime classpaths must not contain the main source-set output')
        }
        if (!mismatchOutput.intersect(missingClasspath).isEmpty()) {
            throw new GradleException('Missing-protocol-receiver fixture runtime classpath must not contain mismatch-fixture output')
        }
        def validateMetadata = { metadataFile, expectedId ->
            def metadata = new JsonSlurper().parse(metadataFile.asFile)
            if (metadata.id != expectedId || metadata.environment != 'client' ||
                  metadata.entrypoints?.keySet() != ['client'] as Set || metadata.depends?.containsKey('mekanism')) {
                throw new GradleException("$expectedId metadata must be a distinct client-only mod with no Mekanism dependency")
            }
        }
        validateMetadata(mismatchMetadataFile, 'mekanism_handshake_mismatch_fixture')
        validateMetadata(missingReceiverMetadataFile, 'mekanism_handshake_missing_receiver_fixture')
        def leakedImports = (mismatchSourceFiles.files + missingReceiverSourceFiles.files).findAll {
            it.text.contains('mekanism.fabric.network') || it.text.contains('net.neoforged.')
        }
        if (!leakedImports.isEmpty()) {
            throw new GradleException("Handshake fixture imports production or NeoForge code: ${leakedImports.join(', ')}")
        }
        def missingPayloadDeclarations = missingReceiverSourceFiles.files.findAll {
            it.text.contains('PayloadTypeRegistry') || it.text.contains('ClientConfigurationNetworking') ||
                  it.text.contains('CustomPacketPayload')
        }
        if (!missingPayloadDeclarations.isEmpty()) {
            throw new GradleException("Missing-protocol-receiver fixture declares a network payload: ${missingPayloadDeclarations.join(', ')}")
        }
    }
}

tasks.named('compileHandshakeMismatchFixtureJava') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('compileHandshakeMissingReceiverFixtureJava') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('runHandshakeMismatchClient') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('runHandshakeMissingReceiverClient') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('check') {
    dependsOn verifyHandshakeFixtureIsolation
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "teamreborn:energy:${team_reborn_energy_version}"
    modHandshakeMismatchFixtureImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modHandshakeMismatchFixtureImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modHandshakeMissingReceiverFixtureImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modHandshakeMissingReceiverFixtureImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "com.electronwill.night-config:core:${night_config_version}"
    implementation "com.electronwill.night-config:toml:${night_config_version}"
    include "com.electronwill.night-config:core:${night_config_version}"
    include "com.electronwill.night-config:toml:${night_config_version}"

    // Annotation types referenced by the official API slice; neither is bundled.
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Keep the official root JUnit pin and its Platform generation aligned with jqwik.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation 'net.jqwik:jqwik:1.9.3'

    // Only transfer-boundary tests need Knot so Fabric API's item/fluid mixins are active.
    fabricTransferTestImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    fabricTransferTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    fabricTransferTestRuntimeOnly "net.fabricmc:fabric-loader-junit:${loader_version}"

    // Root mutation is isolated in a fresh, server-side Knot worker that exits after one method.
    fabricRegistryTestImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    fabricRegistryTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    fabricRegistryTestRuntimeOnly "net.fabricmc:fabric-loader-junit:${loader_version}"
}

def resolvedModVersion = project.version.toString()
processResources {
    inputs.property 'version', resolvedModVersion
    filesMatching('fabric.mod.json') {
        expand version: resolvedModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyApiSliceNoNeoForge'), tasks.named('verifyCommonSliceNoNeoForge'), tasks.named('verifyPlatformSliceNoNeoForge')
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.named('compileTestJava', JavaCompile) {
    dependsOn verifyOfficialRootTestSources
    source officialRootTestOracleFiles
}

def fabricTransferTest = tasks.register('fabricTransferTest', Test) {
    group = 'verification'
    description = 'Runs the isolated Fabric item and fluid transfer tests under one real Knot startup.'
    testClassesDirs = sourceSets.fabricTransferTest.output.classesDirs
    classpath = sourceSets.fabricTransferTest.runtimeClasspath
    mustRunAfter tasks.named('test')
}
tasks.named('check') {
    dependsOn fabricTransferTest
}

def testWorkingDirectory = layout.buildDirectory.dir('test-working')
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    workingDir testWorkingDirectory
    doFirst {
        testWorkingDirectory.get().asFile.mkdirs()
    }
}

def fabricRegistryWorkingDirectory = layout.buildDirectory.dir('fabric-registry-test-working')
def fabricRegistryTest = tasks.register('fabricRegistryTest', Test) {
    group = 'verification'
    description = 'Runs the single custom-root-registry lifecycle test in a fresh server-side Knot worker.'
    testClassesDirs = sourceSets.fabricRegistryTest.output.classesDirs
    classpath = sourceSets.fabricRegistryTest.runtimeClasspath
    maxParallelForks = 1
    forkEvery = 1
    systemProperty 'fabric.side', 'server'
    workingDir fabricRegistryWorkingDirectory
    doFirst {
        fabricRegistryWorkingDirectory.get().asFile.mkdirs()
    }
    mustRunAfter tasks.named('test'), fabricTransferTest
}
def ordinaryXmlResults = layout.buildDirectory.dir('test-results/test')
def transferXmlResults = layout.buildDirectory.dir('test-results/fabricTransferTest')
def registryXmlResults = layout.buildDirectory.dir('test-results/fabricRegistryTest')
def registryOrdinaryTestSource = layout.projectDirectory.file('src/test/java/mekanism/fabric/registry/FabricDefaultedRegistryTest.java')
def deferredOrdinaryTestSource = layout.projectDirectory.file('src/test/java/mekanism/fabric/registry/FabricDeferredRegisterTest.java')
def registryRootTestSource = layout.projectDirectory.file('src/fabricRegistryTest/java/mekanism/fabric/registry/FabricRegistryRootIntegrationTest.java')
def distributionPropertySource = layout.projectDirectory.file('../src/test/java/mekanism/common/lib/distribution/DistributionPropertyTest.java')
def ordinaryTestRuntimeFiles = files(sourceSets.test.runtimeClasspath)
def transferTestRuntimeFiles = files(sourceSets.fabricTransferTest.runtimeClasspath)
def registryTestRuntimeFiles = files(sourceSets.fabricRegistryTest.runtimeClasspath)
def registryRootTestSources = files(sourceSets.fabricRegistryTest.allJava)
def verifyFabricTestContract = tasks.register('verifyFabricTestContract') {
    group = 'verification'
    description = 'Checks isolated loader runtimes and exact ordinary/transfer/root-registry test totals.'
    dependsOn tasks.named('test'), fabricTransferTest, fabricRegistryTest
    inputs.files(registryOrdinaryTestSource, deferredOrdinaryTestSource, registryRootTestSource, distributionPropertySource)
    doLast {
        def loaderJunitFiles = { runtimeFiles ->
            runtimeFiles.files.findAll { it.name.startsWith('fabric-loader-junit-') && it.name.endsWith('.jar') }
        }
        if (!loaderJunitFiles(ordinaryTestRuntimeFiles).isEmpty()) {
            throw new GradleException('The ordinary test runtime must not contain fabric-loader-junit')
        }
        if (loaderJunitFiles(transferTestRuntimeFiles).size() != 1
              || loaderJunitFiles(registryTestRuntimeFiles).size() != 1) {
            throw new GradleException('Transfer and root-registry test runtimes must each contain exactly one pinned fabric-loader-junit')
        }
        def rootSources = registryRootTestSources.files
        if (rootSources.size() != 1 || rootSources.first().canonicalFile != registryRootTestSource.asFile.canonicalFile) {
            throw new GradleException("fabricRegistryTest must contain exactly its one fixed integration source: ${rootSources}")
        }
        def annotationCount = { regularFile ->
            (regularFile.asFile.text =~ /(?m)^\s*@Test\s*$/).count
        }
        if (annotationCount(registryOrdinaryTestSource) != 5 || annotationCount(deferredOrdinaryTestSource) != 5
              || annotationCount(registryRootTestSource) != 1) {
            throw new GradleException('Registry tests must remain exactly 5 existing + 5 ordinary custom + 1 isolated root method')
        }
        def propertyText = distributionPropertySource.asFile.text
        if ((propertyText =~ /@Property\(tries = TRIES\)/).count != 3
              || !(propertyText =~ /private static final int TRIES = 100_000;/).find()) {
            throw new GradleException('The three ordinary jqwik properties must remain pinned to 100,000 tries')
        }
        def readTotals = { output, label, expectedSuites, expectedTests ->
            File directory = output.get().asFile
            File[] reports = directory.listFiles({ File ignored, String name ->
                name.startsWith('TEST-') && name.endsWith('.xml')
            } as FilenameFilter)
            if (reports == null) {
                throw new GradleException("Missing ${label} JUnit XML results in ${directory}")
            }
            int tests = reports.sum(0) { report ->
                new XmlSlurper(false, false).parse(report).@tests.toInteger()
            }
            if (reports.length != expectedSuites || tests != expectedTests) {
                throw new GradleException("Unexpected ${label} totals: suites=${reports.length} tests=${tests}")
            }
            [reports.length, tests]
        }
        def ordinary = readTotals(ordinaryXmlResults, 'ordinary', 67, 320)
        def transfer = readTotals(transferXmlResults, 'transfer', 2, 8)
        def registry = readTotals(registryXmlResults, 'root-registry', 1, 1)
        if (ordinary[0] + transfer[0] + registry[0] != 70 || ordinary[1] + transfer[1] + registry[1] != 329) {
            throw new GradleException('Unexpected aggregate Fabric test totals')
        }
    }
}
tasks.named('check') {
    dependsOn verifyFabricTestContract
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def licenseSuffix = base.archivesName.get()
jar {
    from('../LICENSE') {
        rename { "${it}_${licenseSuffix}" }
    }
}
