def officialRootTestOracleFiles = officialRootTestOracle.collect { file("../src/test/java/${it}") }

def registerPortableSliceCheck = { String taskName, String descriptionText, List<File> sources ->
    tasks.register(taskName) {
        group = 'verification'
        description = descriptionText
        inputs.files(sources)
        doLast {
            def missing = sources.findAll { !it.isFile() }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing portable slice sources: ${missing.join(', ')}")
            }
            def violations = sources.findAll { it.text.contains('net.neoforged.') }
            if (!violations.isEmpty()) {
                throw new GradleException("NeoForge references entered a Fabric source slice: ${violations.join(', ')}")
            }
        }
    }
}
registerPortableSliceCheck('verifyApiSliceNoNeoForge',
      'Checks that every allowlisted official API source exists and has no NeoForge reference.', apiSliceFiles)
registerPortableSliceCheck('verifyCommonSliceNoNeoForge',
      'Checks that every allowlisted official common source exists and has no NeoForge reference.', commonSliceFiles)
registerPortableSliceCheck('verifyPlatformSliceNoNeoForge',
      'Checks that every allowlisted Fabric platform source exists and has no NeoForge reference.', platformSliceFiles)

def verifyOfficialRootTestSources = tasks.register('verifyOfficialRootTestSources') {
    group = 'verification'
    description = 'Checks the exact 18-file official root-test oracle allowlist.'
    inputs.files(officialRootTestOracleFiles)
    doLast {
        if (officialRootTestOracle.size() != 18 || officialRootTestOracle.size() != officialRootTestOracle.toSet().size()) {
            throw new GradleException('The official root-test oracle must contain exactly 18 unique paths')
        }
        def missing = officialRootTestOracleFiles.findAll { !it.isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing official root-test oracle sources: ${missing.join(', ')}")
        }
    }
}

sourceSets {
    handshakeMismatchFixture {
        // Reuse only main's external Minecraft/Fabric compile dependencies; never main output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    handshakeMissingReceiverFixture {
        // Reuse external dependencies but never main or mismatch-fixture output.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath - sourceSets.main.output
    }
    clientWindowFixture {
        // The real-client probe sees production, but production never sees fixture output.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output.classesDirs + (sourceSets.main.runtimeClasspath - sourceSets.main.output)
    }
    portReviewFixture {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    fabricTransferTest {
        // Keep Knot and its TCCL out of the ordinary jqwik/Jupiter suite. This source set
        // contains the item transaction, fluid conversion, and Chemical codec/tank suites, sees production output and
        // its own pinned Jupiter libraries, but never ordinary test output.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    fabricRegistryTest {
        // The sole root-registry integration test gets its own Knot worker and never sees
        // ordinary or transfer-test output.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    fabricDataMapTest {
        // Damage-map ResourceManager and Chemical context/session integration get a fresh server-side Knot worker,
        // isolated from ordinary, transfer, root-registry, and fixture outputs.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    fabricRecipeRegistryTest {
        // Real recipe type/serializer registration must precede Bootstrap.bootStrap(), so it needs its own fresh
        // server-side Knot worker rather than the shared ordinary JVM.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    dataMapReloadFixture {
        // Packaged-server fixture sees production and external dependencies only. Its output is
        // remapped to an isolated directory and never enters the release JAR.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    chemicalRuntimeFixture {
        // Real server/client probe sees production but remains an isolated Loom mod root.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    recipeRuntimeFixture {
        // Real server/client recipe probe sees production but remains an isolated Loom mod root.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    tileUpdateRuntimeFixture {
        // Real server/client reduced-update probe sees production but remains an isolated Loom mod root.
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    main {
        java {
            srcDirs = ['src/main/java', '../src/api/java', '../src/main/java']
            apiSlice.each { include it }
            commonSlice.each { include it }
            platformSlice.each { include it }
        }
    }
}

def mainOutputFiles = files(sourceSets.main.output)
def mismatchOutputFiles = files(sourceSets.handshakeMismatchFixture.output)
def mismatchRuntimeFiles = files(sourceSets.handshakeMismatchFixture.runtimeClasspath)
def missingReceiverRuntimeFiles = files(sourceSets.handshakeMissingReceiverFixture.runtimeClasspath)
def mismatchSourceFiles = files(sourceSets.handshakeMismatchFixture.allJava)
def missingReceiverSourceFiles = files(sourceSets.handshakeMissingReceiverFixture.allJava)
def mismatchMetadataFile = layout.projectDirectory.file('src/handshakeMismatchFixture/resources/fabric.mod.json')
def missingReceiverMetadataFile = layout.projectDirectory.file('src/handshakeMissingReceiverFixture/resources/fabric.mod.json')
def verifyHandshakeFixtureIsolation = tasks.register('verifyHandshakeFixtureIsolation') {
    group = 'verification'
    description = 'Checks that rejection-smoke clients cannot load Mekanism production classes.'
    inputs.files(mismatchSourceFiles, missingReceiverSourceFiles, mismatchMetadataFile, missingReceiverMetadataFile)
    doLast {
        def canonical = { File file -> file.canonicalFile }
        def mainOutput = mainOutputFiles.files.collect(canonical).toSet()
        def mismatchOutput = mismatchOutputFiles.files.collect(canonical).toSet()
        def mismatchClasspath = mismatchRuntimeFiles.files.collect(canonical).toSet()
        def missingClasspath = missingReceiverRuntimeFiles.files.collect(canonical).toSet()
        if (!mainOutput.intersect(mismatchClasspath).isEmpty() || !mainOutput.intersect(missingClasspath).isEmpty()) {
            throw new GradleException('Handshake fixture runtime classpaths must not contain the main source-set output')
        }
        if (!mismatchOutput.intersect(missingClasspath).isEmpty()) {
            throw new GradleException('Missing-protocol-receiver fixture runtime classpath must not contain mismatch-fixture output')
        }
        def validateMetadata = { metadataFile, expectedId ->
            def metadata = new JsonSlurper().parse(metadataFile.asFile)
            if (metadata.id != expectedId || metadata.environment != 'client' ||
                  metadata.entrypoints?.keySet() != ['client'] as Set || metadata.depends?.containsKey('mekanism')) {
                throw new GradleException("$expectedId metadata must be a distinct client-only mod with no Mekanism dependency")
            }
        }
        validateMetadata(mismatchMetadataFile, 'mekanism_handshake_mismatch_fixture')
        validateMetadata(missingReceiverMetadataFile, 'mekanism_handshake_missing_receiver_fixture')
        def leakedImports = (mismatchSourceFiles.files + missingReceiverSourceFiles.files).findAll {
            it.text.contains('mekanism.fabric.network') || it.text.contains('net.neoforged.')
        }
        if (!leakedImports.isEmpty()) {
            throw new GradleException("Handshake fixture imports production or NeoForge code: ${leakedImports.join(', ')}")
        }
        def missingPayloadDeclarations = missingReceiverSourceFiles.files.findAll {
            it.text.contains('PayloadTypeRegistry') || it.text.contains('ClientConfigurationNetworking') ||
                  it.text.contains('CustomPacketPayload')
        }
        if (!missingPayloadDeclarations.isEmpty()) {
            throw new GradleException("Missing-protocol-receiver fixture declares a network payload: ${missingPayloadDeclarations.join(', ')}")
        }
    }
}

tasks.named('compileHandshakeMismatchFixtureJava') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('compileHandshakeMissingReceiverFixtureJava') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('runHandshakeMismatchClient') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('runHandshakeMissingReceiverClient') {
    dependsOn verifyHandshakeFixtureIsolation
}
tasks.named('check') {
    dependsOn verifyHandshakeFixtureIsolation
}

def clientWindowFixtureSources = files(sourceSets.clientWindowFixture.allJava)
def clientWindowFixtureRuntime = files(sourceSets.clientWindowFixture.runtimeClasspath)
def mainResourceOutputFiles = files(sourceSets.main.output.resourcesDir)
def clientWindowFixtureMetadata = layout.projectDirectory.file('src/clientWindowFixture/resources/fabric.mod.json')
def clientWindowFixtureResourceOutput = layout.buildDirectory.dir('resources/clientWindowFixture')
def clientWindowFixtureServices = [
      layout.projectDirectory.file('../src/main/resources/META-INF/services/mekanism.api.text.ITooltipHelper'),
      layout.projectDirectory.file('../src/main/resources/META-INF/services/mekanism.api.datamaps.IMekanismDataMapTypes'),
      layout.projectDirectory.file('../src/main/resources/META-INF/services/mekanism.api.recipes.ingredients.creator.IIngredientCreatorProvider'),
      layout.projectDirectory.file('../src/main/resources/META-INF/services/mekanism.api.recipes.IRecipeTypeRegistry'),
]
def verifyClientWindowFixtureIsolation = tasks.register('verifyClientWindowFixtureIsolation') {
    group = 'verification'
    description = 'Checks the single real-client window probe stays outside production output and metadata.'
    dependsOn tasks.named('processClientWindowFixtureResources')
    inputs.files(clientWindowFixtureSources, clientWindowFixtureMetadata, clientWindowFixtureServices)
    doLast {
        def sources = clientWindowFixtureSources.files
        if (sources.size() != 1 || sources.first().name != 'ClientWindowPersistenceFixture.java') {
            throw new GradleException("clientWindowFixture must contain exactly its one fixed source: ${sources}")
        }
        def metadata = new JsonSlurper().parse(clientWindowFixtureMetadata.asFile)
        if (metadata.id != 'mekanism' || metadata.environment != 'client'
              || metadata.entrypoints?.main != ['mekanism.fabric.MekanismFabricBootstrap']
              || metadata.entrypoints?.client != ['mekanism.fabric.MekanismFabricClientBootstrap', 'mekanism.fixture.ClientWindowPersistenceFixture']) {
            throw new GradleException('Client-window fixture metadata must combine the real bootstraps and sole fixture in one isolated client mod')
        }
        def leaks = sources.findAll { it.text.contains('net.neoforged.') || it.text.contains('mekanism.api.chemical')
              || it.text.contains('mekanism.common.content.qio') }
        if (!leaks.isEmpty()) {
            throw new GradleException("Client-window fixture contains forbidden platform/deferred references: ${leaks}")
        }
        def mainResourceOutput = mainResourceOutputFiles.files.collect { it.canonicalFile }.toSet()
        def fixtureRuntime = clientWindowFixtureRuntime.files.collect { it.canonicalFile }.toSet()
        if (!mainResourceOutput.intersect(fixtureRuntime).isEmpty()) {
            throw new GradleException('Client-window fixture runtime must not load the production fabric.mod.json as a second mod root')
        }
        def productionSources = (apiSliceFiles + commonSliceFiles + platformSliceFiles).collect { it.canonicalFile }.toSet()
        if (!productionSources.intersect(sources.collect { it.canonicalFile }.toSet()).isEmpty()) {
            throw new GradleException('Client-window fixture source entered the production allowlist')
        }
        def serviceDirectory = new File(clientWindowFixtureResourceOutput.get().asFile, 'META-INF/services')
        def actualServices = serviceDirectory.listFiles()?.findAll { it.isFile() }?.collectEntries { [(it.name): it.getBytes()] } ?: [:]
        def expectedServices = [
              'mekanism.api.text.ITooltipHelper': 'mekanism.common.util.text.TooltipHelper'.bytes,
              'mekanism.api.datamaps.IMekanismDataMapTypes': 'mekanism.fabric.datamaps.FabricChemicalDataMaps\n'.bytes,
              'mekanism.api.recipes.ingredients.creator.IIngredientCreatorProvider': 'mekanism.fabric.recipe.FabricIngredientCreatorProvider\n'.bytes,
              'mekanism.api.recipes.IRecipeTypeRegistry': 'mekanism.fabric.recipe.FabricRecipeTypeRegistry\n'.bytes,
        ]
        if (actualServices.keySet() != expectedServices.keySet()
              || actualServices.any { name, bytes -> !java.util.Arrays.equals(bytes, expectedServices[name]) }) {
            throw new GradleException("Client-window fixture must copy exactly both production service descriptors: ${actualServices.keySet()}")
        }
    }
}
tasks.named('compileClientWindowFixtureJava') {
    dependsOn verifyClientWindowFixtureIsolation
}
tasks.named('runClientWindowFixture') {
    dependsOn verifyClientWindowFixtureIsolation
}
tasks.named('check') {
    dependsOn verifyClientWindowFixtureIsolation
}

def chemicalRuntimeFixtureSources = files(sourceSets.chemicalRuntimeFixture.allJava)
def chemicalRuntimeFixtureMetadata = layout.projectDirectory.file('src/chemicalRuntimeFixture/resources/fabric.mod.json')
def verifyChemicalRuntimeFixtureIsolation = tasks.register('verifyChemicalRuntimeFixtureIsolation') {
    group = 'verification'
    description = 'Checks the two real chemical runtime probes remain an isolated non-release Loom mod.'
    inputs.files(chemicalRuntimeFixtureSources, chemicalRuntimeFixtureMetadata)
    doLast {
        def sources = chemicalRuntimeFixtureSources.files
        if (sources.size() != 2 || sources.collect { it.name }.toSet() != [
              'ChemicalRuntimeServerFixture.java', 'ChemicalRuntimeClientFixture.java'] as Set) {
            throw new GradleException("chemicalRuntimeFixture must contain exactly its two fixed probes: ${sources}")
        }
        def metadata = new JsonSlurper().parse(chemicalRuntimeFixtureMetadata.asFile)
        if (metadata.id != 'mekanism_chemical_runtime_fixture' || metadata.environment != '*'
              || metadata.entrypoints?.main != ['mekanism.fabric.network.ChemicalRuntimeServerFixture']
              || metadata.entrypoints?.client != ['mekanism.fabric.chemical.fixture.ChemicalRuntimeClientFixture']
              || metadata.depends?.mekanism != '*') {
            throw new GradleException('Chemical runtime fixture metadata must remain a distinct two-sided mod depending on production Mekanism')
        }
        def leaks = sources.findAll { it.text.contains('net.neoforged.') }
        if (!leaks.isEmpty()) {
            throw new GradleException("Chemical runtime fixture contains NeoForge references: ${leaks}")
        }
        def productionSources = (apiSliceFiles + commonSliceFiles + platformSliceFiles).collect { it.canonicalFile }.toSet()
        if (!productionSources.intersect(sources.collect { it.canonicalFile }.toSet()).isEmpty()) {
            throw new GradleException('Chemical runtime fixture source entered the production allowlist')
        }
    }
}
def recipeRuntimeFixtureSources = files(sourceSets.recipeRuntimeFixture.allJava)
def recipeRuntimeFixtureMetadata = layout.projectDirectory.file('src/recipeRuntimeFixture/resources/fabric.mod.json')
def verifyRecipeRuntimeFixtureIsolation = tasks.register('verifyRecipeRuntimeFixtureIsolation') {
    group = 'verification'
    description = 'Checks the two real recipe runtime probes remain an isolated non-release Loom mod.'
    inputs.files(recipeRuntimeFixtureSources, recipeRuntimeFixtureMetadata)
    doLast {
        def sources = recipeRuntimeFixtureSources.files
        if (sources.size() != 2 || sources.collect { it.name }.toSet() != [
              'RecipeRuntimeServerFixture.java', 'RecipeRuntimeClientFixture.java'] as Set) {
            throw new GradleException("recipeRuntimeFixture must contain exactly its two fixed probes: ${sources}")
        }
        def metadata = new JsonSlurper().parse(recipeRuntimeFixtureMetadata.asFile)
        if (metadata.id != 'mekanism_recipe_runtime_fixture' || metadata.environment != '*'
              || metadata.entrypoints?.main != ['mekanism.fabric.recipe.fixture.RecipeRuntimeServerFixture']
              || metadata.entrypoints?.client != ['mekanism.fabric.recipe.fixture.RecipeRuntimeClientFixture']
              || metadata.depends?.mekanism != '*') {
            throw new GradleException('Recipe runtime fixture metadata must remain a distinct two-sided mod depending on production Mekanism')
        }
        def leaks = sources.findAll { it.text.contains('net.neoforged.') }
        if (!leaks.isEmpty()) {
            throw new GradleException("Recipe runtime fixture contains NeoForge references: ${leaks}")
        }
        def productionSources = (apiSliceFiles + commonSliceFiles + platformSliceFiles).collect { it.canonicalFile }.toSet()
        if (!productionSources.intersect(sources.collect { it.canonicalFile }.toSet()).isEmpty()) {
            throw new GradleException('Recipe runtime fixture source entered the production allowlist')
        }
    }
}
def tileUpdateRuntimeFixtureSources = files(sourceSets.tileUpdateRuntimeFixture.allJava)
def tileUpdateRuntimeFixtureMetadata = layout.projectDirectory.file('src/tileUpdateRuntimeFixture/resources/fabric.mod.json')
def verifyTileUpdateRuntimeFixtureIsolation = tasks.register('verifyTileUpdateRuntimeFixtureIsolation') {
    group = 'verification'
    description = 'Checks the two real reduced-update runtime probes remain an isolated non-release Loom mod.'
    inputs.files(tileUpdateRuntimeFixtureSources, tileUpdateRuntimeFixtureMetadata)
    doLast {
        def sources = tileUpdateRuntimeFixtureSources.files
        if (sources.size() != 3 || sources.collect { it.name }.toSet() != [
              'TileUpdateRuntimeFixture.java', 'TileUpdateRuntimeServerFixture.java', 'TileUpdateRuntimeClientFixture.java'] as Set) {
            throw new GradleException("tileUpdateRuntimeFixture must contain exactly its three fixed probes: ${sources}")
        }
        def metadata = new JsonSlurper().parse(tileUpdateRuntimeFixtureMetadata.asFile)
        if (metadata.id != 'mekanism_tile_update_runtime_fixture' || metadata.environment != '*'
              || metadata.entrypoints?.main != ['mekanism.fabric.tile.fixture.TileUpdateRuntimeServerFixture']
              || metadata.entrypoints?.client != ['mekanism.fabric.tile.fixture.TileUpdateRuntimeClientFixture']
              || metadata.depends?.mekanism != '*') {
            throw new GradleException('Tile update runtime fixture metadata must remain a distinct two-sided mod depending on production Mekanism')
        }
        def leaks = sources.findAll { it.text.contains('net.neoforged.') }
        if (!leaks.isEmpty()) {
            throw new GradleException("Tile update runtime fixture contains NeoForge references: ${leaks}")
        }
        // The fixture subclass must extend the real production base, not re-implement it
        def subclass = sources.find { it.name == 'TileUpdateRuntimeFixture.java' }
        if (!subclass.text.contains('extends TileEntityUpdateable') || !subclass.text.contains('mekanism.common.tile.base.TileEntityUpdateable')
              || !subclass.text.contains('handleUpdateTag') || !subclass.text.contains('loadAdditional')) {
            throw new GradleException('Tile update runtime fixture tile must extend the production base and override both load paths')
        }
        def productionSources = (apiSliceFiles + commonSliceFiles + platformSliceFiles).collect { it.canonicalFile }.toSet()
        if (!productionSources.intersect(sources.collect { it.canonicalFile }.toSet()).isEmpty()) {
            throw new GradleException('Tile update runtime fixture source entered the production allowlist')
        }
    }
}
