import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    handshakeMismatchFixture
    handshakeMissingReceiverFixture
    clientWindowFixture
    fabricTransferTest
    fabricRegistryTest
    fabricDataMapTest
    fabricRecipeRegistryTest
    dataMapReloadFixture
    chemicalRuntimeFixture
    recipeRuntimeFixture
    tileUpdateRuntimeFixture
    portReviewFixture
}

loom {
    accessWidenerPath = file('src/main/resources/mekanism.accesswidener')
    createRemapConfigurations(sourceSets.handshakeMismatchFixture)
    createRemapConfigurations(sourceSets.handshakeMissingReceiverFixture)
    createRemapConfigurations(sourceSets.clientWindowFixture)
    createRemapConfigurations(sourceSets.dataMapReloadFixture)
    createRemapConfigurations(sourceSets.chemicalRuntimeFixture)
    createRemapConfigurations(sourceSets.recipeRuntimeFixture)
    createRemapConfigurations(sourceSets.tileUpdateRuntimeFixture)
    createRemapConfigurations(sourceSets.portReviewFixture)

    mods {
        mekanism {
            sourceSet sourceSets.main
        }
        handshakeMismatchFixture {
            sourceSet sourceSets.handshakeMismatchFixture
        }
        handshakeMissingReceiverFixture {
            sourceSet sourceSets.handshakeMissingReceiverFixture
        }
        clientWindowFixture {
            sourceSet sourceSets.clientWindowFixture
        }
        dataMapReloadFixture {
            sourceSet sourceSets.dataMapReloadFixture
        }
        chemicalRuntimeFixture {
            sourceSet sourceSets.chemicalRuntimeFixture
        }
        recipeRuntimeFixture {
            sourceSet sourceSets.recipeRuntimeFixture
        }
        tileUpdateRuntimeFixture {
            sourceSet sourceSets.tileUpdateRuntimeFixture
        }
    }

    runs {
        handshakeServer {
            server()
            name = 'Mekanism handshake server'
            source sourceSets.main
            runDir = System.getProperty('mekanism.handshake.serverDir', 'run/handshake-server')
        }
        handshakeClient {
            client()
            name = 'Mekanism handshake client'
            source sourceSets.main
            runDir = System.getProperty('mekanism.handshake.clientDir', 'run/handshake-client')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismSmoke')
        }
        clientWindowFixture {
            client()
            name = 'Mekanism client window persistence fixture'
            source sourceSets.clientWindowFixture
            runDir = System.getProperty('mekanism.window.clientDir', 'run/client-window-fixture')
            property 'mekanism.window.fixturePhase', System.getProperty('mekanism.window.fixturePhase', '1')
        }
        chemicalRuntimeServer {
            server()
            name = 'Mekanism chemical runtime server'
            source sourceSets.main
            source sourceSets.chemicalRuntimeFixture
            runDir = System.getProperty('mekanism.chemical.serverDir', 'run/chemical-runtime-server')
            property 'mekanism.chemical.runtimeRoot', System.getProperty('mekanism.chemical.runtimeRoot', 'run/chemical-runtime')
        }
        chemicalRuntimeClient {
            client()
            name = 'Mekanism chemical runtime client'
            source sourceSets.main
            source sourceSets.chemicalRuntimeFixture
            runDir = System.getProperty('mekanism.chemical.clientDir', 'run/chemical-runtime-client')
            property 'mekanism.chemical.runtimeRoot', System.getProperty('mekanism.chemical.runtimeRoot', 'run/chemical-runtime')
            property 'mekanism.chemical.address', System.getProperty('mekanism.chemical.address', '127.0.0.1:25568')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.chemical.address', '127.0.0.1:25568'),
                  '--username', System.getProperty('mekanism.chemical.username', 'MekanismChemical')
        }
        recipeRuntimeServer {
            server()
            name = 'Mekanism recipe runtime server'
            source sourceSets.main
            source sourceSets.recipeRuntimeFixture
            runDir = System.getProperty('mekanism.recipe.serverDir', 'run/recipe-runtime-server')
            property 'mekanism.recipe.runtimeRoot', System.getProperty('mekanism.recipe.runtimeRoot', 'run/recipe-runtime')
        }
        recipeRuntimeClient {
            client()
            name = 'Mekanism recipe runtime client'
            source sourceSets.main
            source sourceSets.recipeRuntimeFixture
            runDir = System.getProperty('mekanism.recipe.clientDir', 'run/recipe-runtime-client')
            property 'mekanism.recipe.runtimeRoot', System.getProperty('mekanism.recipe.runtimeRoot', 'run/recipe-runtime')
            property 'mekanism.recipe.address', System.getProperty('mekanism.recipe.address', '127.0.0.1:25569')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.recipe.address', '127.0.0.1:25569'),
                  '--username', System.getProperty('mekanism.recipe.username', 'MekRecipe')
        }
        tileUpdateRuntimeServer {
            server()
            name = 'Mekanism tile update runtime server'
            source sourceSets.main
            source sourceSets.tileUpdateRuntimeFixture
            runDir = System.getProperty('mekanism.tile.serverDir', 'run/tile-update-runtime-server')
            property 'mekanism.tile.runtimeRoot', System.getProperty('mekanism.tile.runtimeRoot', 'run/tile-update-runtime')
        }
        tileUpdateRuntimeClient {
            client()
            name = 'Mekanism tile update runtime client'
            source sourceSets.main
            source sourceSets.tileUpdateRuntimeFixture
            runDir = System.getProperty('mekanism.tile.clientDir', 'run/tile-update-runtime-client')
            property 'mekanism.tile.runtimeRoot', System.getProperty('mekanism.tile.runtimeRoot', 'run/tile-update-runtime')
            property 'mekanism.tile.address', System.getProperty('mekanism.tile.address', '127.0.0.1:25570')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.tile.address', '127.0.0.1:25570'),
                  '--username', System.getProperty('mekanism.tile.username', 'MekTile')
        }
        handshakeMismatchClient {
            client()
            name = 'Mekanism mismatched handshake fixture client'
            source sourceSets.handshakeMismatchFixture
            runDir = System.getProperty('mekanism.handshake.mismatchClientDir', 'run/handshake-mismatch-client')
            property 'mekanism.handshake.fixtureMode', System.getProperty('mekanism.handshake.fixtureMode', 'version_mismatch')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismMismatch')
        }
        handshakeMissingReceiverClient {
            client()
            name = 'Mekanism missing-protocol-receiver handshake fixture client'
            source sourceSets.handshakeMissingReceiverFixture
            runDir = System.getProperty('mekanism.handshake.missingReceiverClientDir', 'run/handshake-missing-receiver-client')
            programArgs '--quickPlayMultiplayer', System.getProperty('mekanism.handshake.address', '127.0.0.1:25567'),
                  '--username', System.getProperty('mekanism.handshake.username', 'MekanismMissing')
        }
    }
}

repositories {
    // Team Reborn Energy is published on Fabric's Maven. Keep this build isolated
    // from the NeoForge repositories in the root build.
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'org.openzen.zencode' }
    }
}

def loadSlice = { String listName ->
    def entries = file(listName).readLines()
          .collect { it.trim() }
          .findAll { it && !it.startsWith('#') }
    if (entries.size() != entries.toSet().size()) {
        throw new GradleException("fabric/${listName} contains duplicate source paths")
    }
    entries
}
def apiSlice = loadSlice('api-slice.txt')
def commonSlice = loadSlice('common-slice.txt')
def platformSlice = loadSlice('platform-slice.txt')
def apiSliceFiles = apiSlice.collect { file("../src/api/java/${it}") }
def commonSliceFiles = commonSlice.collect { file("../src/main/java/${it}") }
def platformSliceFiles = platformSlice.collect { file("src/main/java/${it}") }
if (apiSlice.size() != 262 || commonSlice.size() != 1389 || platformSlice.size() != 125) {
    throw new GradleException("Unexpected Fabric source slice counts: api=${apiSlice.size()} common=${commonSlice.size()} platform=${platformSlice.size()}")
}

// Compile only the unchanged official root tests that cover admitted common-slice
// source root: unrelated NeoForge tests must remain outside the Fabric test closure.
def officialRootTestOracle = [
      'mekanism/common/lib/collection/BiLongMultimapTest.java',
      'mekanism/common/lib/collection/IndexedCuboidMapTest.java',
      'mekanism/common/lib/distribution/DistributionTest.java',
      'mekanism/common/lib/distribution/DistributionLongTest.java',
      'mekanism/common/lib/distribution/DistributionPropertyTest.java',
      'mekanism/common/lib/distribution/handler/InfiniteIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/InfiniteLongHandler.java',
      'mekanism/common/lib/distribution/handler/IntegerHandler.java',
      'mekanism/common/lib/distribution/handler/LongHandler.java',
      'mekanism/common/lib/distribution/handler/LyingAmountIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/LyingAmountLongHandler.java',
      'mekanism/common/lib/distribution/handler/PartialIntegerHandler.java',
      'mekanism/common/lib/distribution/handler/PartialLongHandler.java',
      'mekanism/common/lib/distribution/handler/SpecificAmountIntegerHandler.java',
