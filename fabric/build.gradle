plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom supplies Minecraft and Fabric repositories. Keep this build isolated
    // from the NeoForge repositories in the root build.
    mavenCentral()
}

def apiSlice = file('api-slice.txt').readLines()
      .collect { it.trim() }
      .findAll { it && !it.startsWith('#') }

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../src/api/java']
            include 'mekanism/fabric/**/*.java'
            apiSlice.each { include it }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Annotation types referenced by the official API slice; neither is bundled.
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

def resolvedModVersion = project.version.toString()
processResources {
    inputs.property 'version', resolvedModVersion
    filesMatching('fabric.mod.json') {
        expand version: resolvedModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def licenseSuffix = base.archivesName.get()
jar {
    from('../LICENSE') {
        rename { "${it}_${licenseSuffix}" }
    }
}
