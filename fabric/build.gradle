def verifyFabricTestContract = tasks.register('verifyFabricTestContract') {
    group = 'verification'
    description = 'Checks isolated loader runtimes and exact ordinary/transfer/root/data-map test totals.'
    dependsOn tasks.named('test'), fabricTransferTest, fabricRegistryTest, fabricDataMapTest, fabricRecipeRegistryTest
    inputs.files(registryOrdinaryTestSource, deferredOrdinaryTestSource, registryRootTestSource,
          dataMapOrdinaryTestSource, dataMapKnotTestSource, chemicalDataMapKnotTestSource,
          chemicalDomainTestSource, chemicalServiceTestSource, chemicalSnapshotTestSource, chemicalTransferTestSource,
          ingredientClosureTestSource, inputHelperExecutionTestSource, genericInputCacheTestSource, rotaryInputCacheTestSource,
          distributionPropertySource, windowConfigTestSource, windowDomainTestSource, concreteSlotTestSource, fabricItemStorageTestSource,
          recipeOutputHandlingTestSource, recipeSerializerContractTestSource, recipeRegistryKnotTestSource, recipeTypeOwnerTestSource,
          recipeCacheLookupMonitorTestSource, tileUpdateLifecycleTestSource,
          apiFirstInitTestSource, commonFirstInitTestSource)
    doLast {
        def loaderJunitFiles = { runtimeFiles ->
            runtimeFiles.files.findAll { it.name.startsWith('fabric-loader-junit-') && it.name.endsWith('.jar') }
        }
        if (!loaderJunitFiles(ordinaryTestRuntimeFiles).isEmpty()) {
            throw new GradleException('The ordinary test runtime must not contain fabric-loader-junit')
        }
        if (loaderJunitFiles(transferTestRuntimeFiles).size() != 1
              || loaderJunitFiles(registryTestRuntimeFiles).size() != 1
              || loaderJunitFiles(dataMapTestRuntimeFiles).size() != 1
              || loaderJunitFiles(recipeRegistryTestRuntimeFiles).size() != 1) {
            throw new GradleException('Transfer, root-registry, data-map, and recipe-registry test runtimes must each contain exactly one pinned fabric-loader-junit')
        }
        def rootSources = registryRootTestSources.files
        if (rootSources.size() != 1 || rootSources.first().canonicalFile != registryRootTestSource.asFile.canonicalFile) {
            throw new GradleException("fabricRegistryTest must contain exactly its one fixed integration source: ${rootSources}")
        }
        def dataMapSources = dataMapKnotTestSources.files.collect { it.canonicalFile }.toSet()
        def expectedDataMapSources = [dataMapKnotTestSource.asFile.canonicalFile, chemicalDataMapKnotTestSource.asFile.canonicalFile] as Set
        if (dataMapSources != expectedDataMapSources) {
            throw new GradleException("fabricDataMapTest must contain exactly its two fixed integration sources: ${dataMapSources}")
        }
        def recipeRegistrySources = recipeRegistryKnotTestSources.files.collect { it.canonicalFile }.toSet()
        def expectedRecipeRegistrySources = [recipeRegistryKnotTestSource.asFile.canonicalFile, apiFirstInitTestSource.asFile.canonicalFile,
              commonFirstInitTestSource.asFile.canonicalFile] as Set
        if (recipeRegistrySources != expectedRecipeRegistrySources) {
            throw new GradleException("fabricRecipeRegistryTest must contain exactly its three fixed sources: ${recipeRegistrySources}")
        }
        def annotationCount = { regularFile ->
            (regularFile.asFile.text =~ /(?m)^\s*@Test\s*$/).count
        }
        if (annotationCount(registryOrdinaryTestSource) != 5 || annotationCount(deferredOrdinaryTestSource) != 5
              || annotationCount(registryRootTestSource) != 3 || annotationCount(dataMapOrdinaryTestSource) != 4
              || annotationCount(dataMapKnotTestSource) != 1 || annotationCount(chemicalDataMapKnotTestSource) != 3
              || annotationCount(chemicalDomainTestSource) != 12 || annotationCount(chemicalServiceTestSource) != 5
              || annotationCount(chemicalSnapshotTestSource) != 7 || annotationCount(chemicalTransferTestSource) != 6
              || annotationCount(ingredientClosureTestSource) != 6 || annotationCount(inputHelperExecutionTestSource) != 6
              || annotationCount(genericInputCacheTestSource) != 7 || annotationCount(rotaryInputCacheTestSource) != 5 || annotationCount(windowConfigTestSource) != 6
              || annotationCount(windowDomainTestSource) != 6 || annotationCount(concreteSlotTestSource) != 6
              || annotationCount(fabricItemStorageTestSource) != 5 || annotationCount(recipeOutputHandlingTestSource) != 6
              || annotationCount(recipeSerializerContractTestSource) != 6 || annotationCount(recipeRegistryKnotTestSource) != 6
              || annotationCount(recipeTypeOwnerTestSource) != 6 || annotationCount(recipeCacheLookupMonitorTestSource) != 8
              || annotationCount(apiFirstInitTestSource) != 1 || annotationCount(commonFirstInitTestSource) != 1) {
            throw new GradleException('Registry/data-map/window/slot/recipe fixed test method counts changed')
        }
        def propertyText = distributionPropertySource.asFile.text
        if ((propertyText =~ /@Property\(tries = TRIES\)/).count != 3
              || !(propertyText =~ /private static final int TRIES = 100_000;/).find()) {
            throw new GradleException('The three ordinary jqwik properties must remain pinned to 100,000 tries')
        }
        def readTotals = { output, label, expectedSuites, expectedTests ->
            File directory = output.get().asFile
            File[] reports = directory.listFiles({ File ignored, String name ->
                name.startsWith('TEST-') && name.endsWith('.xml')
            } as FilenameFilter)
            if (reports == null) {
                throw new GradleException("Missing ${label} JUnit XML results in ${directory}")
            }
            int tests = reports.sum(0) { report ->
                new XmlSlurper(false, false).parse(report).@tests.toInteger()
            }
            if (reports.length != expectedSuites || tests != expectedTests) {
                throw new GradleException("Unexpected ${label} totals: suites=${reports.length} tests=${tests}")
            }
            [reports.length, tests]
        }
        def ordinary = readTotals(ordinaryXmlResults, 'ordinary', 85, 424)
        def transfer = readTotals(transferXmlResults, 'transfer', 9, 43)
        def registry = readTotals(registryXmlResults, 'root-registry', 1, 3)
        def dataMap = readTotals(dataMapXmlResults, 'data-map', 2, 4)
        def recipeRegistry = readTotals(recipeRegistryXmlResults, 'recipe-registry', 3, 8)
        if (ordinary[0] + transfer[0] + registry[0] + dataMap[0] + recipeRegistry[0] != 100
              || ordinary[1] + transfer[1] + registry[1] + dataMap[1] + recipeRegistry[1] != 482) {
            throw new GradleException('Unexpected aggregate Fabric test totals')
        }
    }
}
tasks.named('check') {
    dependsOn verifyFabricTestContract
}

