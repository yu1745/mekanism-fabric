        include 'data/mekanism/tags/mekanism/chemical/water_vapor.json'
        //All generated vanilla/Mekanism block, item, entity, fluid, game-event, damage, mob-effect, data-component and
        //worldgen-biome tags: tag files merge with lower packs (replace=false), so these only add the official entries.
        include 'data/mekanism/tags/**'
        include 'data/minecraft/tags/**'
        //Fabric's convention namespace replaces NeoForge's; the generated c: tags define osmium/tin/lead families
        //that only the mod itself can provide. NeoForge-specific data/tags stay out (no loader equivalent).
        include 'data/c/tags/**'
        //Generated block loot tables use only vanilla functions plus Mekanism's own personal_storage_contents.
        include 'data/mekanism/loot_table/**'
        //Vanilla/Mekanism-trigger advancements and the canonical robit skin catalog (verified portable: no NeoForge
        //or foreign-mod references).
        include 'data/mekanism/advancement/**'
        //Official recipes that only use vanilla/Mekanism JSON shapes. `compat/**` targets other mods and is gated by
        //NeoForge mod_loaded conditions; the listed files use the NeoForge compound ingredient. Both await the datagen lane.
        include 'data/mekanism/recipe/**'
        exclude 'data/mekanism/recipe/compat/**'
        def neoforgeOnlyRecipes = file('recipe-neoforge-only.txt').readLines()
              .findAll { it && !it.startsWith('#') } as Set
        exclude { details -> neoforgeOnlyRecipes.contains(details.path) }
        include 'data/mekanism/mekanism/robit_skin/**'
    }
