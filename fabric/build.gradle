plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom supplies Minecraft and Fabric repositories. Keep this build isolated
    // from the NeoForge repositories in the root build.
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

def resolvedModVersion = project.version.toString()
processResources {
    inputs.property 'version', resolvedModVersion
    filesMatching('fabric.mod.json') {
        expand version: resolvedModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

def licenseSuffix = base.archivesName.get()
jar {
    from('../LICENSE') {
        rename { "${it}_${licenseSuffix}" }
    }
}
