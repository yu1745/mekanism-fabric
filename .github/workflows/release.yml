name: Release

# Push a tag such as v10.7.19.85+fabric.1 to build the four Fabric JARs and attach them, with build-info.json
# (sha256 of each JAR), to a GitHub release.
on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./build.sh --clean
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/build-info.json
          generate_release_notes: true
