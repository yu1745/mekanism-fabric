name: CI

# JVM unit tests and the four-JAR assemble. Tasks that need a Minecraft runtime (the fabric*Test integration tasks
# and the scripts/*-smoke.sh gates) are run locally, see docs/Development.md.
on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
    branches: [ "1.21.1" ]

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, verify the API slice, assemble
        run: ./gradlew -p fabric test verifyApiSliceNoNeoForge assemble --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-jars
          path: |
            fabric/build/libs/*.jar
            fabric/build/tools-libs/*.jar
            fabric/build/additions-libs/*.jar
            fabric/build/generators-libs/*.jar
          retention-days: 7
