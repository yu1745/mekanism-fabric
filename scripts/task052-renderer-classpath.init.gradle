// Task052 renderer focused compilation support (diagnostic-only, no production slice admission).
// Writes the Loom-resolved (remapped mojmap Minecraft + remapped Fabric API) main compile classpath:
//   ./gradlew -p fabric -I "$PWD/scripts/task052-renderer-classpath.init.gradle" printMainCompileClasspath --no-configuration-cache -q
gradle.projectsEvaluated {
    def target = gradle.rootProject
    target.tasks.register('printMainCompileClasspath') {
        group = 'diagnostics'
        doLast {
            def cp = target.extensions.getByName('sourceSets').getByName('main').compileClasspath.asPath
            def out = new File(target.layout.buildDirectory.get().asFile, 'task052-main-compile-classpath.txt')
            out.parentFile.mkdirs()
            out.text = cp
            println "TASK052_MAIN_COMPILE_CLASSPATH_WRITTEN " + out
        }
    }
}
